name: Generate SSQ DeepSeek Prediction

on:
  schedule:
    # 每周一、三、五 北京时间 08:00 (UTC 00:00)
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

jobs:
  generate-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai python-dotenv

      - name: Generate DeepSeek prediction
        run: python3 scripts/generate_ssq_prediction.py
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ssq_predictions.json data/ssq_predictions_history.json
          git commit -m "chore: generate SSQ DeepSeek prediction $(date +'%Y-%m-%d %H:%M:%S')"
          git push
