name: Update DLT Lottery Data

##on:
  schedule:
    # 每天北京时间 22:30 (UTC 14:30)
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch DLT history
        run: |
          cd fetch_history
          python3 fetch_sports_lottery_history.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/sports_lottery_data.json fetch_history/sports_lottery_data.json
          git commit -m "chore: update DLT lottery data $(date +'%Y-%m-%d %H:%M:%S')"
          git push
